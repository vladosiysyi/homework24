<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Skystore</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="/">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="/contacts/">Контакты</a>
        <a class="p-2 btn btn-outline-primary" href="/blog/">Блог</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'product_list' %}">Продукты</a>

        <!-- Добавим ссылки на аутентификацию -->
       {% if user.is_authenticated %}
  <form action="{% url 'logout' %}" method="post" style="display:inline;">
    {% csrf_token %}
    <button type="submit" class="p-2 btn btn-outline-danger">Выйти</button>
  </form>
{% else %}
  <a class="p-2 btn btn-outline-secondary" href="{% url 'login' %}">Вход</a>
  <a class="p-2 btn btn-outline-secondary" href="{% url 'register' %}">Регистрация</a>
{% endif %}

    </nav>
</div>
