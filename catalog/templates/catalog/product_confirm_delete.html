{% extends "base.html" %}

{% block title %}Удаление продукта{% endblock %}

{% block content %}
<h2>Удалить продукт</h2>
<p>Вы уверены, что хотите удалить <strong>{{ object.name }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'product_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
