{% extends "base.html" %}
{% block title %}{% if form.instance.pk %}Редактировать статью{% else %}Создать статью{% endif %}{% endblock %}
{% block content %}
<div class="container">
    <h1>{% if form.instance.pk %}Редактировать статью{% else %}Создать статью{% endif %}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Сохранить</button>
        <a href="{% url 'blog_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
